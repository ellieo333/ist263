<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid magenta;
        }
        section{
            display: flex; /*this propety must go on the row*/
        }
        section div{
            flex: 1;
        }
        .column2{
            flex: 1;
        }
        .column3{
            flex: 3;
        }
    </style>
</head>
<body>
    <section>
        <div>1</div>
    </section>  

    <section>
        <div class="column2">2</div>
        <div class="column3">3</div>
    </section>

    <section>
        <div>4</div>
        <div>5</div>

    </section>
    
</body>
</html>
