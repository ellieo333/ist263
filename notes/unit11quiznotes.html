<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script>
        function rightAnswer () {
            document.getElementById("right").innerHTML = '<span style="color: green;"> False is the Correct Answer!</span>';
        }
        function wrongAnswer () {
            document.getElementById("wrong").innerHTML = '<span style="color: red;">True is the Correct Answer</span>';
        }
    </script>
</head>
<body>
    <h1>Javascript Quiz</h1>
    <p>1. Java and javascript are the same thing</p>
    <p id="wrong" onclick="wrongAnswer();">True</p>
    <p id="right" onclick="rightAnswer();">False</p>
</body>
</html>
