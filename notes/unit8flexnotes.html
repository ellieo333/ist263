<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Intro</title>
    <style>
        div{
            border: 1px solid green;
        }
        section{
            display: flex; /*this propety must go on the row*/
        }
        section div{
            flex: 1; /* must go on the column(s)*/
        }
    </style>
</head>
<body>
<section> <!--this is a flexbox row-->
    <div>1</div> <!--this is a flexbox column-->
    <div>2</div>
    <div>3</div>
</section>

</body>
</html>
